[project]
name = "voleyia-backend"
version = "0.1.0"
description = "VoleyIA Coach: sistema de recomendación de entrenamiento con IA"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy>=2",
  "alembic",
  "pymysql",
  "cryptography",
  "httpx",
  "pandas",
  "openpyxl",
  "scipy",
  "statsmodels",
  "scikit-learn",
  "passlib[bcrypt]",
  "bcrypt<4.1",
  "python-jose[cryptography]",
  "python-multipart",
  "email-validator",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff", "black"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
